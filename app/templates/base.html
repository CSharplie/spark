<!doctype html>
<html lang="{{ locale }}" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ t("app.name") }}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="/static/vendor/htmx.min.js" defer></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="min-h-full bg-slate-50 text-slate-900">
    <header
      class="flex flex-wrap items-center gap-3 border-b border-slate-200 bg-white px-4 py-3"
    >
      <span class="mr-auto text-lg font-semibold">{{ t("app.name") }}</span>
      {% if current_user %}
      <nav class="flex gap-4 text-sm font-medium">
        <a href="/dashboard" class="rounded px-2 py-2 hover:bg-slate-100">{{ t("nav.dashboard") }}</a>
        <a href="/import" class="rounded px-2 py-2 hover:bg-slate-100">{{ t("nav.import") }}</a>
      </nav>
      {% endif %}
      {% if current_user %}
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <button
          type="submit"
          class="min-h-[44px] rounded px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          {{ t("nav.logout") }}
        </button>
      </form>
      {% endif %}
    </header>
    <main class="mx-auto w-full max-w-5xl px-4 py-6">{% block content %}{% endblock %}</main>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
