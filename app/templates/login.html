{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="mb-4 text-xl font-semibold">{{ t("login.title") }}</h1>
  {% if error %}
  <p class="mb-4 rounded bg-red-50 px-3 py-2 text-sm text-red-700">{{ t("login.error") }}</p>
  {% endif %}
  <form method="post" action="/login" class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-sm font-medium">
      {{ t("login.username") }}
      <input
        type="text"
        name="username"
        required
        autofocus
        class="min-h-[44px] rounded border border-slate-300 px-3 py-2 text-base"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium">
      {{ t("login.password") }}
      <input
        type="password"
        name="password"
        required
        class="min-h-[44px] rounded border border-slate-300 px-3 py-2 text-base"
      />
    </label>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <button
      type="submit"
      class="min-h-[44px] rounded bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700"
    >
      {{ t("login.submit") }}
    </button>
  </form>
</div>
{% endblock %}
